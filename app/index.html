  <dialog id="support-dialog" aria-labelledby="support-title">
    <div class="dialog-content">
      <p class="muted">先照顾此刻的你</p>
      <h2 id="support-title">你可以找现实中的支持</h2>
      <p>如果你有立即伤害自己或他人的危险，请联系所在地急救，或到附近急诊。尽可能让一个可信任的人陪在身边。</p>
      <p>中国大陆可拨打 <a href="tel:12356">12356 心理援助热线</a>。其他地区请使用当地心理支持和紧急服务。热线不替代急救，接听情况因地区而异。</p>
      <p>也可以向可信任的人说：“我现在有点难，能不能陪我待一会儿？”</p>
      <p class="small muted">这个原型不能判断你的安全状态、提供诊断或代替专业帮助。</p>
      <a class="source-link" href="https://www.nhc.gov.cn/xcs/c100122/202507/4819417642d4432fb9f227e1e10ca616.shtml" target="_blank" rel="noopener noreferrer">查看热线官方来源 ↗</a>
      <form method="dialog"><button class="primary" type="submit">返回</button></form>
    </div>
  </dialog>
